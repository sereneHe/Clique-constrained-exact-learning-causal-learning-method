hydra:
  # Keep both single-run and multirun Hydra artifacts under one discoverable
  # tree.  Sweep launchers may still override hydra.sweep.dir explicitly.
  run:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  sweeper:
    max_batch_size: 500 # There is a quota on RCI cluster that limits number of scheduled jobs to 500.
    params:
#      max_batch_size: 1
      #scenario:
      #distribution_coefficient: 1,2,3,4
experiment: DAGS article
tracking: mlflow
plot: false
plot_dpi: 300
skip_first: 0
defaults:
  - solver: milp
  - problem: dynamic
  - override hydra/launcher: basic
  #- override hydra/launcher: configured_submitit_slurm
  - _self_


